x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
  AIRFLOW__CORE__FERNET_KEY: _aPiFhS8QMF-ArImGlX3urWFkXRtM24s8qGO09hns6w=
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
  AIRFLOW__WEBSERVER__SECRET_KEY: week11devsecret
  AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
  _AIRFLOW_WWW_USER_USERNAME: admin
  _AIRFLOW_WWW_USER_PASSWORD: admin
  PYTHONPATH: /opt/airflow/src
  PROJECT_ROOT: /opt/airflow
  ANALYTICS_DB_URI: postgresql://airflow:airflow@postgres:5432/analytics

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      retries: 20

  airflow:
    build: .
    user: "0:0"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *airflow-env
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./reports:/opt/airflow/reports
      - ./models:/opt/airflow/models
      - ./scripts:/opt/airflow/scripts
      - ./apps:/opt/airflow/apps
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      retries: 20
      start_period: 40s

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PYTHONPATH: /app/src
      PROJECT_ROOT: /app
      ANALYTICS_DB_URI: postgresql://airflow:airflow@postgres:5432/analytics
    ports:
      - "8501:8501"
    volumes:
      - ./src:/app/src
      - ./apps:/app/apps
      - ./data:/app/data
      - ./reports:/app/reports
      - ./models:/app/models

volumes:
  postgres_data:
